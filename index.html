<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAE Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF1;
  --card:#FFFFFF;
  --ink:#101A24;
  --ink-2:#3E5061;
  --line:#8FA1B2;
  --line-soft:#C6D1DB;
  --room:#FFFFFF;
  --tile:#F0F3F6;
  --focus:#0B5FD4;
  --start:#1B4FD8;
  --mid1:#0A8BA8;
  --mid2:#12833F;
  --mid3:#C07A00;
  --end:#C62A20;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Atkinson Hyperlegible',Verdana,system-ui,sans-serif;
  font-size:20px;
  line-height:1.5;
}
.wrap{max-width:1400px;margin:0 auto;padding:26px 22px 80px}

header{margin-bottom:22px}
header h1{
  font-size:46px;margin:0;font-weight:700;
  display:flex;align-items:baseline;gap:0;line-height:1.1;
}
header h1 .logo{height:.72em;width:auto;display:block;margin-right:2px}
header h1 span{color:var(--ink);letter-spacing:-.01em}
header p{margin:4px 0 0;font-size:21px;color:var(--ink-2)}

/* ---------- controls ---------- */
.panel{
  background:var(--card);border:3px solid var(--ink);border-radius:10px;
  padding:22px 24px;margin-bottom:26px;
}
.row{display:grid;grid-template-columns:1fr 1fr;gap:26px}
@media(max-width:880px){.row{grid-template-columns:1fr}}
fieldset{border:0;margin:0;padding:0}
legend,.qlabel{font-size:24px;font-weight:700;margin-bottom:10px;display:block}
.floorpick{display:flex;gap:12px;margin-bottom:12px}
.floorpick button{
  flex:1;font-family:inherit;font-size:21px;font-weight:700;padding:14px 10px;
  background:#fff;color:var(--ink);border:3px solid var(--line);border-radius:8px;cursor:pointer;
}
.floorpick button:hover{border-color:var(--ink)}
.floorpick button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
select{
  width:100%;font-family:inherit;font-size:23px;padding:15px 16px;
  background:#fff;color:var(--ink);border:3px solid var(--line);border-radius:8px;
}
select optgroup{font-size:19px;font-weight:700;color:var(--ink-2);font-style:normal}
select option{font-size:22px;font-weight:400;color:var(--ink)}
:focus-visible{outline:4px solid var(--focus);outline-offset:2px}

.actions{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:24px;padding-top:22px;border-top:3px solid var(--line-soft)}
button.go{
  font-family:inherit;font-size:24px;font-weight:700;padding:17px 40px;
  background:var(--start);color:#fff;border:3px solid var(--start);border-radius:8px;cursor:pointer;
}
button.go:hover{background:#12369a;border-color:#12369a}
label.big{
  display:flex;align-items:center;gap:12px;font-size:20px;cursor:pointer;
}
label.big input{width:26px;height:26px;accent-color:var(--start)}
button.plain{
  font-family:inherit;font-size:19px;padding:14px 22px;background:#fff;color:var(--ink);
  border:3px solid var(--line);border-radius:8px;cursor:pointer;margin-left:auto
}
button.plain:hover{border-color:var(--ink)}

/* ---------- key ---------- */
.key{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  background:var(--card);border:3px solid var(--ink);border-radius:10px;padding:16px 22px;margin-bottom:22px;
}
.key .item{display:flex;align-items:center;gap:9px;font-size:19px}
.key .chip{width:26px;height:26px;border-radius:50%;border:3px solid var(--ink)}
.key .barwrap{display:flex;align-items:center;gap:12px;margin-left:auto}
.key .bar{width:230px;height:16px;border-radius:9px;border:2px solid var(--ink);
  background:linear-gradient(90deg,var(--start),var(--mid1) 28%,var(--mid2) 52%,var(--mid3) 76%,var(--end))}
@media(max-width:880px){.key .barwrap{margin-left:0}}

/* ---------- floors ---------- */
.floor{
  background:var(--card);border:3px solid var(--ink);border-radius:10px;overflow:hidden;margin-bottom:26px;
}
.floor.hide{display:none}
.floor .head{
  display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:3px solid var(--ink);
  background:#DCE4EC;flex-wrap:wrap
}
.floor .head h2{margin:0;font-size:28px}
.floor .head .note{font-size:19px;color:var(--ink-2)}
.floor svg{display:block;width:100%;height:auto;background:var(--card)}
.mapbox{cursor:zoom-in}
button.enlarge{
  margin-left:auto;font-family:inherit;font-size:19px;font-weight:700;padding:11px 20px;
  background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:8px;cursor:pointer
}
button.enlarge:hover{background:var(--ink);color:#fff}

.viewer{position:fixed;inset:0;background:#fff;z-index:50;display:flex;flex-direction:column}
.viewer[hidden]{display:none}
.viewer-bar{
  display:flex;align-items:center;gap:14px;padding:14px 20px;
  border-bottom:3px solid var(--ink);background:#DCE4EC;flex-wrap:wrap
}
.viewer-bar strong{font-size:26px;margin-right:auto}
.viewer-bar button{
  font-family:inherit;font-size:20px;font-weight:700;padding:12px 24px;
  background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:8px;cursor:pointer
}
.viewer-bar button.close{background:var(--ink);color:#fff}
.viewer-body{flex:1;overflow:auto;padding:16px;-webkit-overflow-scrolling:touch}
.viewer-body svg{display:block;height:auto}

.slab-r{fill:#F7F9FB;stroke:#101A24;stroke-width:3.5}
.tile-r{fill:var(--tile);stroke:#B4C1CD;stroke-width:1.5}
.hall-r{fill:#DDE6EE;stroke:none}
.block-r{fill:#C3CFDA;stroke:#101A24;stroke-width:3}
.tread{stroke:#8798A8;stroke-width:1.6}
.tread-box{fill:none;stroke:#5D7285;stroke-width:2}
.room-r{fill:var(--room);stroke:#3E5061;stroke-width:2.2}
.room-r.hot{fill:#E4ECFF;stroke:#101A24;stroke-width:3.5}
.sim-r{fill:#F1F4F7;stroke:#3E5061;stroke-width:2.4}
.bridge{stroke:#3E5061;stroke-width:6;stroke-linecap:round}
.rlabel{font-family:'Atkinson Hyperlegible',Verdana,sans-serif;fill:#101A24;font-size:21px;font-weight:700;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.rlabel.sm{font-size:17px}
.rlabel.area{font-weight:400;fill:#3E5061;font-size:16px}
.pin-t{font-family:'Atkinson Hyperlegible',Verdana,sans-serif;font-weight:700;font-size:19px;text-anchor:middle;fill:#fff}
.callout{font-family:'Atkinson Hyperlegible',Verdana,sans-serif;font-weight:700;font-size:20px;fill:#101A24}

.msg{background:#FFF3F2;border:3px solid var(--end);border-radius:10px;padding:20px 24px;font-size:21px;margin-bottom:26px}
details.adv{margin-top:20px}
details.adv summary{font-size:19px;cursor:pointer;color:var(--ink-2)}
details.adv textarea{
  width:100%;max-width:520px;height:120px;font-family:inherit;font-size:18px;padding:12px;
  border:3px solid var(--line);border-radius:8px;margin-top:12px;display:block
}
@media print{
  body{background:#fff}
  .panel,.key .barwrap,button.plain{display:none}
  .floor{break-inside:avoid}
}
</style>
</head>

/* ============ GRAPH ============ */
const N={},ADJ={},ROOM={};
const gid=(f,i)=>f+':'+i;
function addEdge(a,b,c){(ADJ[a]=ADJ[a]||[]).push({to:b,c});(ADJ[b]=ADJ[b]||[]).push({to:a,c});}
for(const fk of [1,2]){
  const F=FLOORS[fk];
  for(const [id,v] of Object.entries(F.nodes)) N[gid(fk,id)]={id,fl:fk,x:v[0],y:v[1]};
  const dist=(a,b)=>Math.hypot(N[a].x-N[b].x,N[a].y-N[b].y)*F.scale;
  for(const ch of F.chains){
    const ids=[...ch.ids].sort((a,b)=>ch.axis==='x'?F.nodes[a][0]-F.nodes[b][0]:F.nodes[a][1]-F.nodes[b][1]);
    for(let i=0;i<ids.length-1;i++){const a=gid(fk,ids[i]),b=gid(fk,ids[i+1]);if(a!==b)addEdge(a,b,Math.max(dist(a,b),.4));}
  }
  for(const e of F.edges)addEdge(gid(fk,e[0]),gid(fk,e[1]),dist(gid(fk,e[0]),gid(fk,e[1])));
  for(const r of F.rooms)
    ROOM[gid(fk,r.id)]={...r,fl:fk,cx:r.x+r.w/2,cy:r.y+r.h/2,doorG:gid(fk,r.door),label:r.short||r.id};
}
function route(s,e,stepFree){
  const adj={};for(const [k,v] of Object.entries(ADJ))adj[k]=v.slice();
  for(const L of LINKS){
    if(stepFree&&L[4]==='stairs')continue;
    const a=gid(L[1],L[0]),b=gid(L[3],L[2]);
    (adj[a]=adj[a]||[]).push({to:b,c:L[5]});(adj[b]=adj[b]||[]).push({to:a,c:L[5]});
  }
  const D={},P={},S={};D[s]=0;const Q=[[0,s]];
  while(Q.length){
    Q.sort((a,b)=>a[0]-b[0]);const [d,u]=Q.shift();
    if(S[u])continue;S[u]=1;if(u===e)break;
    for(const x of (adj[u]||[])){const nd=d+x.c;
      if(D[x.to]===undefined||nd<D[x.to]-1e-9){D[x.to]=nd;P[x.to]=u;Q.push([nd,x.to]);}}
  }
  if(D[e]===undefined)return null;
  const p=[];let c=e;while(c!==undefined){p.unshift(c);c=P[c];}
  return p;
}

/* ============ COLOR ============ */
const STOPS=[[0,[27,79,216]],[.28,[10,139,168]],[.52,[18,131,63]],[.76,[192,122,0]],[1,[198,42,32]]];
function spectrum(t){
  t=Math.max(0,Math.min(1,t));
  for(let i=0;i<STOPS.length-1;i++){
    const [p0,c0]=STOPS[i],[p1,c1]=STOPS[i+1];
    if(t>=p0&&t<=p1){const k=(t-p0)/(p1-p0||1);
      return 'rgb('+c0.map((v,j)=>Math.round(v+(c1[j]-v)*k)).join(',')+')';}
  }
  return 'rgb(198,42,32)';
}
const isNum=id=>/^[0-9]+[A-Z]?$/.test(id);
const nameOf=r=>(isNum(r.id)?'Room ':'')+r.label;
const REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ============ MAP ============ */
function renderFloor(fk,path,oG,dG){
  const F=FLOORS[fk];
  const hot=new Set();
  if(ROOM[oG]&&ROOM[oG].fl===fk)hot.add(ROOM[oG].id);
  if(ROOM[dG]&&ROOM[dG].fl===fk)hot.add(ROOM[dG].id);
  let s=`<svg viewBox="${F.vb}" role="img" aria-label="${F.name} floor plan with the route drawn">`;
  s+=`<polygon class="slab-r" points="${F.slab}"/>`;
  for(const t of F.tiles)s+=`<rect class="tile-r" x="${t.x}" y="${t.y}" width="${t.w}" height="${t.h}"/>`;
  for(const h of (F.halls||[]))s+=`<rect class="hall-r" x="${h.x}" y="${h.y}" width="${h.w}" height="${h.h}"/>`;
  for(const b of (F.blocks||[]))s+=`<rect class="block-r" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}"/>`;
  for(const t of (F.treads||[])){
    const n=Math.max(4,Math.round(t.h/13));
    for(let i=1;i<n;i++){
      const y=t.y+t.h*i/n;
      s+=`<line class="tread" x1="${t.x+2}" y1="${y}" x2="${t.x+t.w-2}" y2="${y}"/>`;
    }
    s+=`<rect class="tread-box" x="${t.x}" y="${t.y}" width="${t.w}" height="${t.h}"/>`;
  }
  for(const e of (F.extras||[]))s+=`<rect class="slab-r" x="${e.x}" y="${e.y}" width="${e.w}" height="${e.h}"/>`;
  for(const r of F.rooms){
    if(r.bridge)s+=`<line class="bridge" x1="${r.bridge[0]}" y1="${r.bridge[1]}" x2="${r.bridge[2]}" y2="${r.bridge[3]}"/>`;
    const cls=r.sim?'sim-r':(r.ghost?'tile-r':'room-r'+(hot.has(r.id)?' hot':''));
    s+=`<rect class="${cls}" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="${r.sim?12:3}"/>`;
    const lc='rlabel'+(r.area||r.ghost?' area':'')+(r.sm?' sm':'');
    const lbl=r.short||r.id;
    if(r.area&&lbl.length>10){
      const p=lbl.split(' ');
      s+=`<text class="${lc}" x="${r.x+r.w/2}" y="${r.y+r.h/2-9}">${p[0]}</text>`;
      s+=`<text class="${lc}" x="${r.x+r.w/2}" y="${r.y+r.h/2+10}">${p.slice(1).join(' ')}</text>`;
    }else s+=`<text class="${lc}" x="${r.x+r.w/2}" y="${r.y+r.h/2}">${lbl}</text>`;
  }

  if(path&&path.length>1){
    const all=[];let tot=0;
    for(let i=0;i<path.length-1;i++){
      const a=N[path[i]],b=N[path[i+1]];
      const same=a.fl===b.fl;
      const d=same?Math.hypot(a.x-b.x,a.y-b.y)*FLOORS[a.fl].scale:0;
      all.push({a,b,d,same});tot+=d;
    }
    const segs=[];let cum=0;
    for(const sg of all){const t0=tot?cum/tot:0;cum+=sg.d;const t1=tot?cum/tot:1;
      if(sg.same&&sg.a.fl===fk)segs.push({...sg,tm:(t0+t1)/2});}
    for(const sg of segs)
      s+=`<line x1="${sg.a.x}" y1="${sg.a.y}" x2="${sg.b.x}" y2="${sg.b.y}" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" opacity=".95"/>`;
    for(const sg of segs)
      s+=`<line x1="${sg.a.x}" y1="${sg.a.y}" x2="${sg.b.x}" y2="${sg.b.y}" stroke="${spectrum(sg.tm)}" stroke-width="9" stroke-linecap="round"/>`;
    for(const sg of segs){
      const len=Math.hypot(sg.b.x-sg.a.x,sg.b.y-sg.a.y);if(len<55)continue;
      const mx=(sg.a.x+sg.b.x)/2,my=(sg.a.y+sg.b.y)/2;
      const ux=(sg.b.x-sg.a.x)/len,uy=(sg.b.y-sg.a.y)/len;
      s+=`<path d="M ${mx-ux*7-uy*7} ${my-uy*7+ux*7} L ${mx+ux*8} ${my+uy*8} L ${mx-ux*7+uy*7} ${my-uy*7-ux*7}" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
    // arrows that travel along the route
    if(!REDUCED){
      const runs=[];let cur=[];
      for(const p of path){
        if(N[p].fl===fk)cur.push(N[p]);
        else{if(cur.length>1)runs.push(cur);cur=[]}
      }
      if(cur.length>1)runs.push(cur);
      for(const run of runs){
        const pts=run.filter((p,i)=>i===0||Math.hypot(p.x-run[i-1].x,p.y-run[i-1].y)>1);
        if(pts.length<2)continue;
        let len=0;
        for(let i=0;i<pts.length-1;i++)len+=Math.hypot(pts[i+1].x-pts[i].x,pts[i+1].y-pts[i].y);
        const d='M '+pts.map(p=>p.x+' '+p.y).join(' L ');
        const dur=Math.max(5,len/95).toFixed(1);
        const count=Math.max(2,Math.min(9,Math.round(len/170)));
        for(let i=0;i<count;i++){
          s+=`<g><circle r="14" fill="#FFFFFF" stroke="#101A24" stroke-width="3"/>`+
             `<path d="M -4 -6 L 5 0 L -4 6" fill="none" stroke="#101A24" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>`+
             `<animateMotion path="${d}" dur="${dur}s" begin="${(-i*dur/count).toFixed(2)}s" repeatCount="indefinite" rotate="auto"/></g>`;
        }
      }
    }
    // stairs / elevator marker
    for(let i=0;i<path.length-1;i++){
      const a=N[path[i]],b=N[path[i+1]];
      if(a.fl===b.fl)continue;
      const here=a.fl===fk?a:(b.fl===fk?b:null);if(!here)continue;
      const up=b.fl>a.fl, onThis=a.fl===fk;
      const col=spectrum(.5);
      s+=`<circle cx="${here.x}" cy="${here.y}" r="20" fill="#fff" stroke="${col}" stroke-width="5"/>`;
      s+=`<text class="rlabel" x="${here.x}" y="${here.y+1}" fill="${col}" font-size="24">${(onThis===up)?'\u2191':'\u2193'}</text>`;
      s+=callout(here,onThis?('Go '+(up?'up':'down')+' to Floor '+(onThis?b.fl:a.fl)):'You arrive here',col,fk,34);
    }
    const first=N[path[0]],last=N[path[path.length-1]];
    if(first.fl===fk){
      s+=pin(first,spectrum(0));
      s+=callout(first,'Start: '+nameOf(ROOM[oG]),spectrum(0),fk,30);
    }
    if(last.fl===fk){
      s+=pin(last,spectrum(1));
      s+=callout(last,'Finish: '+nameOf(ROOM[dG]),spectrum(1),fk,30);
    }
  }
  s+='</svg>';
  return s;
}
function pin(n,col){
  return `<circle cx="${n.x}" cy="${n.y}" r="19" fill="#fff" stroke="${col}" stroke-width="5"/>
          <circle cx="${n.x}" cy="${n.y}" r="9" fill="${col}"/>`;
}
function callout(n,text,col,fk,off){
  const H=parseFloat(FLOORS[fk].vb.split(' ')[3]);
  const W=parseFloat(FLOORS[fk].vb.split(' ')[2]);
  const below=n.y<H*0.55;
  const y=below?n.y+off+18:n.y-off;
  const w=text.length*11+26;
  let x=n.x-w/2; x=Math.max(6,Math.min(W-w-6,x));
  return `<g><rect x="${x}" y="${y-22}" width="${w}" height="32" rx="16" fill="#fff" stroke="${col}" stroke-width="3.5"/>
   <text class="callout" x="${x+w/2}" y="${y-1}" text-anchor="middle" fill="${col}">${text}</text></g>`;
}

const DISPLAY={
  '2:215':'E190 Brief',       '2:216':'E190 Debrief',
  '2:221':'A320 Brief',       '2:222':'A320 Debrief',
  '2:223':'777 Brief',        '2:225':'777 Debrief',

  '2:232':'E170 Brief',       '2:233':'E170 Debrief',
  '2:234':'737_Max_2 Brief',  '2:236':'737_Max_2 Debrief',

  '2:737 #1':'SIM 737_Max_1', '2:737 #2':'SIM 737_Max_2',
  '2:E170':'SIM E170',        '2:E190':'SIM E190'
};
const optionName=(k,r)=>DISPLAY[k]||nameOf(r);

function roomsFor(fl){
  return Object.entries(ROOM).filter(([k,r])=>r.fl==fl).sort((a,b)=>{
    const A=a[1],B=b[1],an=isNum(A.id),bn=isNum(B.id);
    if(an&&bn)return parseInt(A.id)-parseInt(B.id);
    if(an)return -1;if(bn)return 1;return A.label.localeCompare(B.label);
  });
}
function fill(sel,fl,keep){
  sel.innerHTML='';
  const g={sim:[],brief:[],debrief:[],room:[],area:[]};
  for(const [k,r] of roomsFor(fl)){
    const lbl=optionName(k,r);
    if(lbl.startsWith('SIM ')) g.sim.push([k,lbl,lbl.slice(4)]);
    else if(lbl.endsWith(' Brief')) g.brief.push([k,lbl,lbl.slice(0,-6)]);
    else if(lbl.endsWith(' Debrief')) g.debrief.push([k,lbl,lbl.slice(0,-8)]);
    else if(isNum(r.id)) g.room.push([k,lbl,lbl]);
    else g.area.push([k,lbl,lbl]);
  }
  const byFleet=(a,b)=>a[2].localeCompare(b[2],undefined,{numeric:true,sensitivity:'base'});
  g.sim.sort(byFleet);g.brief.sort(byFleet);g.debrief.sort(byFleet);
  const groups=[['Simulators',g.sim],['Brief rooms',g.brief],['Debrief rooms',g.debrief],
                [g.sim.length?'Other rooms':'Rooms',g.room],['Areas',g.area]];
  for(const [name,items] of groups){
    if(!items.length)continue;
    const og=document.createElement('optgroup');og.label=name;
    for(const [k,lbl] of items){
      const o=document.createElement('option');o.value=k;o.textContent=lbl;og.appendChild(o);
    }
    sel.appendChild(og);
  }
  if(keep&&[...sel.options].some(o=>o.value===keep))sel.value=keep;
}

    [...$(boxId).querySelectorAll('button')].forEach(x=>x.setAttribute('aria-pressed',x===b));
    setter(+b.dataset.f);
  });
}

function go(){
  const oG=$('r1').value,dG=$('r2').value;
  const o=ROOM[oG],d=ROOM[dG];
  const msg=$('msg');msg.innerHTML='';
  if(oG===dG){
    msg.innerHTML='<div class="msg" style="background:#F0F5FF;border-color:#1B4FD8">You are already at '+nameOf(d)+'.</div>';
    $('svg1').innerHTML=renderFloor(1,null,oG,dG);$('svg2').innerHTML=renderFloor(2,null,oG,dG);
    $('floorbox1').className='floor'+(o.fl===1?'':' hide');
    $('floorbox2').className='floor'+(o.fl===2?'':' hide');
    return;
  }
  const p=route(o.doorG,d.doorG,false);
  if(!p){
    msg.innerHTML='<div class="msg">No route found between these two places.</div>';
    return;
  }
  $('svg1').innerHTML=renderFloor(1,p,oG,dG);
  $('svg2').innerHTML=renderFloor(2,p,oG,dG);
  const on1=p.some(x=>N[x].fl===1),on2=p.some(x=>N[x].fl===2);
  $('floorbox1').className='floor'+(on1?'':' hide');
  $('floorbox2').className='floor'+(on2?'':' hide');
  if(on1&&on2){
    const useElev=p.some(x=>N[x].id.startsWith('elev'));
    const startFirst=o.fl===1;
    $('note1').textContent=startFirst?'Start here, then take the '+(useElev?'elevator':'stairs')+' up.':'Finish on this floor.';
    $('note2').textContent=startFirst?'Finish on this floor.':'Start here, then take the '+(useElev?'elevator':'stairs')+' down.';
  }else{$('note1').textContent='';$('note2').textContent='';}
  if(!$('viewer').hidden)paintViewer();
}
go();
</script>
