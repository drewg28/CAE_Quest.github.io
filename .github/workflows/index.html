<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAEQuest — Office Directory</title>
<style>
  :root{
    --ink:#0a1730;
    --panel:#122a4f;
    --panel-2:#0e2140;
    --line:#3a5a8c;
    --text:#eaf1fb;
    --text-dim:#8fa5c7;
    --you:#f2a93b;
    --dest:#ff6f59;
    --core:#2969f2;
    --core-dark:#0d1f45;
    --core-bright:#5b8dff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;
    min-height:100vh;
    padding:28px 20px 60px;
  }
  .wrap{max-width:1180px;margin:0 auto;}

  header{margin-bottom:24px;}
  h1{
    font-family:"Bahnschrift","DIN Alternate","Arial Narrow",sans-serif;
    font-weight:700;
    letter-spacing:0.4px;
    font-size:clamp(26px,4vw,36px);
    margin:0;
  }
  h1 .brand-cae{ color:var(--core); }
  header p{
    margin:8px 0 0;
    color:var(--text-dim);
    font-size:15px;
    max-width:62ch;
    line-height:1.5;
  }

  .panel{
    background:var(--panel);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:10px;
  }

  .controls{
    display:grid;
    grid-template-columns:1fr 1fr auto;
    gap:16px;
    padding:20px;
    margin-bottom:22px;
    align-items:end;
  }
  @media (max-width:820px){ .controls{grid-template-columns:1fr;} }

  .field-group{
    border:1px solid rgba(255,255,255,0.08);
    border-radius:8px;
    padding:14px 16px 16px;
    background:var(--panel-2);
  }
  .field-group h2{
    margin:0 0 12px;
    font-size:12px;
    letter-spacing:0.6px;
    font-weight:600;
    color:var(--text-dim);
    font-family:"Bahnschrift","DIN Alternate","Arial Narrow",sans-serif;
  }
  .field-group.you h2::before{content:"● "; color:var(--you);}
  .field-group.go h2::before{content:"● "; color:var(--dest);}

  label{display:block; font-size:12px; color:var(--text-dim); margin:10px 0 4px;}
  label:first-of-type{margin-top:0;}
  select{
    width:100%;
    background:var(--ink);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:6px;
    padding:9px 10px;
    font-size:14.5px;
    font-family:inherit;
  }
  select:focus{outline:2px solid var(--core); outline-offset:1px;}

  button.go-btn{
    background:var(--core);
    color:#ffffff;
    border:none;
    border-radius:8px;
    font-size:15px;
    font-weight:700;
    padding:14px 26px;
    cursor:pointer;
    font-family:"Bahnschrift","DIN Alternate","Arial Narrow",sans-serif;
    letter-spacing:0.3px;
    height:fit-content;
  }
  button.go-btn:hover{background:var(--core-bright);}
  button.go-btn:active{transform:scale(0.97);}
  @media (max-width:820px){ button.go-btn{width:100%;} }

  .steps{ display:none; padding:16px 20px; margin-bottom:22px; }
  .steps.show{display:block;}
  .steps h2{
    margin:0 0 10px;
    font-size:12px;
    letter-spacing:0.6px;
    color:var(--text-dim);
    font-family:"Bahnschrift","DIN Alternate","Arial Narrow",sans-serif;
  }
  .steps ol{ margin:0; padding-left:20px; line-height:1.7; font-size:15px; }
  .steps .same-msg{ font-size:15px; color:var(--core); }

  .maps{ display:grid; grid-template-columns:1fr; gap:14px; max-width:1000px; margin:0 auto; }

  .floor-tabs{
    display:flex; gap:8px; margin-bottom:14px; max-width:1000px; margin-left:auto; margin-right:auto;
  }
  .floor-tab{
    flex:1;
    background:var(--panel-2);
    border:1px solid rgba(255,255,255,0.1);
    color:var(--text-dim);
    font-family:"Bahnschrift","DIN Alternate","Arial Narrow",sans-serif;
    font-size:14px;
    font-weight:600;
    letter-spacing:0.3px;
    padding:12px 14px;
    border-radius:8px;
    cursor:pointer;
    text-align:center;
    position:relative;
  }
  .floor-tab.active{
    background:var(--panel);
    color:var(--text);
    border-color:var(--core);
    box-shadow:0 0 0 1px var(--core) inset;
  }
  .floor-tab .dot{
    display:inline-block; width:8px; height:8px; border-radius:50%;
    margin-right:7px; position:relative; top:-1px;
  }
  .floor-tab .dot.you{ background:var(--you); }
  .floor-tab .dot.dest{ background:var(--dest); }

  .go-to-floor{
    display:none;
    max-width:1000px; margin:0 auto 14px; padding:12px 16px;
    background:var(--core-dark); border:1px solid var(--core); border-radius:8px;
    color:var(--text); font-size:14px; align-items:center; justify-content:space-between; gap:12px;
  }
  .go-to-floor.show{ display:flex; }
  .go-to-floor button{
    background:var(--core); color:#ffffff; border:none; border-radius:6px;
    font-weight:700; font-size:13px; padding:8px 14px; cursor:pointer;
    font-family:"Bahnschrift","DIN Alternate","Arial Narrow",sans-serif; white-space:nowrap;
  }

  .map-card{ padding:16px; }
  .map-card .floor-label{
    font-family:"Bahnschrift","DIN Alternate","Arial Narrow",sans-serif;
    font-size:13px;
    letter-spacing:0.5px;
    color:var(--text-dim);
    margin:0 0 10px;
  }
  .plan-stage{ position:relative; width:100%; background:#fff; border-radius:4px; overflow:hidden; }
  .plan-stage img{ display:block; width:100%; height:auto; image-rendering:-webkit-optimize-contrast; }
  .plan-stage svg{ position:absolute; top:0; left:0; width:100%; height:100%; }

  .pin{ position:absolute; transform:translate(-50%,-100%); text-align:center; }
  .pin .dot{
    width:16px; height:16px; border-radius:50%;
    border:2px solid #1a2029;
    margin:0 auto;
    box-shadow:0 1px 4px rgba(0,0,0,0.4);
  }
  .pin.you .dot{ background:var(--you); }
  .pin.dest .dot{ background:var(--dest); }
  .pin.you{ color:var(--you); }
  .pin.dest{ color:var(--dest); }
  .pin .tag{
    font-family:"Bahnschrift","DIN Alternate","Arial Narrow",sans-serif;
    font-size:12px; font-weight:700;
    background:rgba(0,0,0,0.72);
    color:#fff;
    padding:2px 6px;
    border-radius:4px;
    white-space:nowrap;
    display:inline-block;
    margin-bottom:3px;
  }
  .pin .ring{
    position:absolute; left:50%; top:0; width:16px; height:16px;
    transform:translate(-50%,0);
    border-radius:50%;
    border:2px solid var(--you);
    animation:pulse 1.8s ease-out infinite;
  }
  @keyframes pulse{
    0%{ transform:translate(-50%,0) scale(1); opacity:0.7; }
    100%{ transform:translate(-50%,0) scale(2.4); opacity:0; }
  }

  .route-line{ fill:none; stroke:var(--core-bright); stroke-width:2.6; stroke-dasharray:8 6; stroke-linecap:round; stroke-linejoin:round; }
  .route-line.outline{ stroke:#fff; stroke-width:5.5; stroke-dasharray:none; opacity:0.85; }

  .legend{ display:flex; gap:22px; flex-wrap:wrap; margin-top:18px; font-size:12.5px; color:var(--text-dim); }
  .legend span{ display:inline-flex; align-items:center; gap:7px; }
  .legend i{ width:11px;height:11px;border-radius:50%;display:inline-block; }
  .legend .line-sample{ width:20px; height:0; border-top:2.6px dashed var(--core-bright); border-radius:0; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1><span class="brand-cae">CAE</span>Quest</h1>
    <p>Pick where you are and where you're headed — it'll mark both spots on the floor plan and trace the route along the hallway to get there.</p>
  </header>

  <div class="controls panel">
    <div class="field-group you">
      <h2>You are</h2>
      <label for="you-floor">Floor</label>
      <select id="you-floor"></select>
      <label for="you-room">At</label>
      <select id="you-room"></select>
    </div>
    <div class="field-group go">
      <h2>Going to</h2>
      <label for="go-floor">Floor</label>
      <select id="go-floor"></select>
      <label for="go-room">Room</label>
      <select id="go-room"></select>
    </div>
    <button class="go-btn" id="route-btn">Show me the way</button>
  </div>

  <div class="steps panel" id="steps-panel">
    <h2>Directions</h2>
    <div id="steps-content"></div>
  </div>

  <div class="floor-tabs" id="floor-tabs"></div>
  <div class="go-to-floor" id="go-to-floor">
    <span id="go-to-floor-text"></span>
    <button id="go-to-floor-btn">Switch floor →</button>
  </div>
  <div class="maps" id="maps-container"></div>

  <div class="legend">
    <span><i style="background:var(--you)"></i> You are here</span>
    <span><i style="background:var(--dest)"></i> Destination</span>
    <span><i style="background:var(--core)"></i> Stairs / Elevator</span>
    <span><span class="line-sample"></span> Route (via hallway)</span>
  </div>

</div>

/* Build a route between two rooms on the SAME floor: room -> its via chain
   out to the hallway -> straight run along the hallway -> the other room's
   via chain, reversed, back in. Two via-endpoints are "on the same line"
   (and can just be connected directly) if they share a Y, like two rooms
   both opening onto the same horizontal hallway, OR share an X, like two
   rooms both opening onto the same vertical corridor/branch (e.g. Front
   Desk, Stairs and Elevator all sitting on Floor 1's x=600 branch) - in
   that case the join is a single straight run, no detour needed. If they
   share neither, they're on genuinely different lines (Floor 2's outer
   hallway vs. its middle hallway, or Floor 1's main hallway vs. its
   branch), so detour through the nearest pass-through between them. */
function corridorPath(floor, roomA, roomB){
  var pts = [{x:roomA.x,y:roomA.y}];
  roomA.via.forEach(function(p){ pts.push(p); });

  var endA = roomA.via[roomA.via.length-1];
  var endB = roomB.via[roomB.via.length-1];
  var sameLine = (endA.y === endB.y) || (endA.x === endB.x);
  if(!sameLine && floor.passthroughs){
    var px = nearestPassthroughOn(floor.passthroughs, endA.x, endB.x);
    pts.push({x:px, y:endA.y});
    pts.push({x:px, y:endB.y});
  }

  roomB.via.slice().reverse().forEach(function(p){ pts.push(p); });
  pts.push({x:roomB.x,y:roomB.y});
  return pts;
}
function nearestPassthroughOn(list, xA, xB){
  var mid = (xA+xB)/2;
  return list.reduce(function(best,c){
    return Math.abs(c-mid) < Math.abs(best-mid) ? c : best;
  });
}

function renderFloorStage(floor, opts){
  opts = opts || {};
  var pins = '';
  ['youId','destId'].forEach(function(key){
    var id = opts[key];
    if(!id) return;
    var r = getRoom(floor, id);
    if(!r) return;
    var kind = key==='youId' ? 'you' : 'dest';
    var leftPct = (r.x/floor.w*100).toFixed(2);
    var topPct = (r.y/floor.h*100).toFixed(2);
    var ring = kind==='you' ? '<div class="ring"></div>' : '';
    pins += '<div class="pin '+kind+'" style="left:'+leftPct+'%; top:'+topPct+'%;">' +
              '<span class="tag">'+r.label+'</span>' +
              '<div class="dot" style="position:relative;">'+ring+'</div>' +
            '</div>';
  });

  var svgOverlay = '';
  if(opts.pathPts && opts.pathPts.length > 1){
    var pts = opts.pathPts.map(function(p){
      return (p.x/floor.w*100)+','+(p.y/floor.h*100);
    }).join(' ');
    svgOverlay = '<svg viewBox="0 0 100 100" preserveAspectRatio="none">' +
      '<polyline class="route-line outline" points="'+pts+'" vector-effect="non-scaling-stroke"></polyline>' +
      '<polyline class="route-line" points="'+pts+'" vector-effect="non-scaling-stroke"></polyline>' +
      '</svg>';
  }

  return '<div class="plan-stage">' +
           '<img src="'+floor.img+'" alt="'+floor.name+' plan">' +
           svgOverlay +
           pins +
         '</div>';
}

/* ---------- controls ---------- */
var youFloorSel = document.getElementById('you-floor');
var youRoomSel = document.getElementById('you-room');
var goFloorSel = document.getElementById('go-floor');
var goRoomSel = document.getElementById('go-room');
var mapsContainer = document.getElementById('maps-container');
var stepsPanel = document.getElementById('steps-panel');
var stepsContent = document.getElementById('steps-content');
var floorTabsEl = document.getElementById('floor-tabs');
var goToFloorEl = document.getElementById('go-to-floor');
var goToFloorText = document.getElementById('go-to-floor-text');
var goToFloorBtn = document.getElementById('go-to-floor-btn');

function fillFloorSelect(sel){
  sel.innerHTML = FLOORS.map(function(f){return '<option value="'+f.id+'">'+f.name+'</option>';}).join("");
}
function fillRoomSelect(sel, floor, preferId){
  var opts = floor.rooms.slice().sort(function(a,b){
    if(a.group==='core' && b.group!=='core') return 1;
    if(b.group==='core' && a.group!=='core') return -1;
    return 0;
  });
  sel.innerHTML = opts.map(function(r){
    return '<option value="'+r.id+'">'+r.label+(r.group==='core' ? ' (Core)' : '')+'</option>';
  }).join("");
  if(preferId && floor.rooms.some(function(r){return r.id===preferId;})){
    sel.value = preferId;
  }
}

fillFloorSelect(youFloorSel);
fillFloorSelect(goFloorSel);
youFloorSel.value = 1;
goFloorSel.value = 2;
fillRoomSelect(youRoomSel, getFloor(1), "front-desk");
fillRoomSelect(goRoomSel, getFloor(2), "207");

/* current: which floor's map is on screen, and what to draw on each floor
   once a route has been generated (null = just show plain previews) */
var activeFloorId = 1;
var routeByFloor = null; /* {1:{youId,destId,pathPts}, 2:{...}} or null */
var routeIsSameFloor = true;

function renderTabs(){
  floorTabsEl.innerHTML = FLOORS.map(function(f){
    var dots = '';
    if(routeByFloor && routeByFloor[f.id]){
      if(routeByFloor[f.id].youId) dots += '<span class="dot you"></span>';
      if(routeByFloor[f.id].destId) dots += '<span class="dot dest"></span>';
    }
    var cls = 'floor-tab' + (f.id===activeFloorId ? ' active' : '');
    return '<div class="'+cls+'" data-floor="'+f.id+'">'+dots+f.name+'</div>';
  }).join('');
  Array.prototype.forEach.call(floorTabsEl.querySelectorAll('.floor-tab'), function(el){
    el.addEventListener('click', function(){
      activeFloorId = Number(el.getAttribute('data-floor'));
      renderActiveFloor();
    });
  });
}

function renderActiveFloor(){
  renderTabs();
  var floor = getFloor(activeFloorId);
  var opts = (routeByFloor && routeByFloor[floor.id]) ? routeByFloor[floor.id] : {};
  mapsContainer.innerHTML =
    '<div class="map-card panel">' +
      '<p class="floor-label">'+floor.name+'</p>' +
      renderFloorStage(floor, opts) +
    '</div>';

  /* if this is a cross-floor route and we're looking at the "from" floor,
     surface a quick way to jump to the other floor to see the rest of it */
  if(routeByFloor && !routeIsSameFloor){
    var otherId = FLOORS.map(function(f){return f.id;}).filter(function(id){return id!==activeFloorId;})[0];
    var otherFloor = getFloor(otherId);
    var amStart = routeByFloor[activeFloorId] && routeByFloor[activeFloorId].youId;
    if(amStart){
      goToFloorEl.classList.add('show');
      goToFloorText.textContent = 'Route continues on ' + otherFloor.name + '.';
      goToFloorBtn.textContent = otherFloor.name + ' →';
      goToFloorBtn.onclick = function(){ activeFloorId = otherId; renderActiveFloor(); };
    } else {
      goToFloorEl.classList.remove('show');
    }
  } else {
    goToFloorEl.classList.remove('show');
  }
}

youFloorSel.addEventListener('change', function(){
  fillRoomSelect(youRoomSel, getFloor(youFloorSel.value));
  activeFloorId = Number(youFloorSel.value);
  routeByFloor = null;
  renderActiveFloor();
});
goFloorSel.addEventListener('change', function(){
  fillRoomSelect(goRoomSel, getFloor(goFloorSel.value));
  routeByFloor = null;
  renderActiveFloor();
});
youRoomSel.addEventListener('change', function(){ routeByFloor = null; renderActiveFloor(); });
goRoomSel.addEventListener('change', function(){ routeByFloor = null; renderActiveFloor(); });

document.getElementById('route-btn').addEventListener('click', function(){
  var yFloor = getFloor(youFloorSel.value);
  var gFloor = getFloor(goFloorSel.value);
  var yRoom = getRoom(yFloor, youRoomSel.value);
  var gRoom = getRoom(gFloor, goRoomSel.value);

  stepsPanel.classList.add('show');
  activeFloorId = yFloor.id;

  if(yFloor.id === gFloor.id){
    routeIsSameFloor = true;
    if(yRoom.id === gRoom.id){
      routeByFloor = {};
      routeByFloor[yFloor.id] = {youId:yRoom.id, destId:gRoom.id};
      stepsContent.innerHTML = '<p class="same-msg">You\'re already there — '+yRoom.label+' on '+yFloor.name+'.</p>';
      renderActiveFloor();
      return;
    }
    var pathPts = corridorPath(yFloor, yRoom, gRoom);
    routeByFloor = {};
    routeByFloor[yFloor.id] = {youId:yRoom.id, destId:gRoom.id, pathPts:pathPts};
    stepsContent.innerHTML =
      '<ol><li>From '+yRoom.label+', follow the hallway on '+yFloor.name+'.</li>' +
      '<li>Arrive at '+gRoom.label+'.</li></ol>';
  } else {
    routeIsSameFloor = false;
    var yCore = pickCore(yFloor);
    var gCore = pickCore(gFloor);
    var pathA = corridorPath(yFloor, yRoom, yCore);
    var pathB = corridorPath(gFloor, gCore, gRoom);
    var dir = Number(gFloor.id) > Number(yFloor.id) ? 'up' : 'down';

    routeByFloor = {};
    routeByFloor[yFloor.id] = {youId:yRoom.id, destId:yCore.id, pathPts:pathA};
    routeByFloor[gFloor.id] = {youId:gCore.id, destId:gRoom.id, pathPts:pathB};

    stepsContent.innerHTML =
      '<ol>' +
      '<li>From '+yRoom.label+' on '+yFloor.name+', follow the hallway to the '+yCore.label+'.</li>' +
      '<li>Go '+dir+' to '+gFloor.name+'.</li>' +
      '<li>From the '+gCore.label+', follow the hallway to '+gRoom.label+'.</li>' +
      '</ol>';
  }
  renderActiveFloor();
});

renderActiveFloor();
</script>
</body>
</html>
